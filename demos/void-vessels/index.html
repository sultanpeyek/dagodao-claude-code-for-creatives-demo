  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "name": "Void Vessels",
    "description": "Generate unique procedural wireframe spacecraft from numeric seeds. Create deterministic NFT-ready ship designs.",
    "url": "https://sultanpeyek.github.io/dagodao-claude-code-for-creatives-demo/demos/void-vessels/",

<body>
  <div class="app">
    <header>
      <h1>Void Vessels</h1>
      <p class="subtitle">Procedural NFT Ship Generator</p>
    </header>

    <div class="main-content">
      <div class="viewport">
        <div class="canvas-wrapper">
          <canvas id="canvas"></canvas>
          <div id="loading" class="loading">Generating...</div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="controls">
          <div class="control-group">
            <label for="seed-input">Seed</label>
            <div class="input-row">
              <input type="number" id="seed-input" value="12345" min="0">
              <button id="random-btn" type="button" title="Random Seed" aria-label="Generate random seed">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="2" width="20" height="20" rx="2"/>
                  <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
                  <circle cx="16" cy="8" r="1.5" fill="currentColor"/>
                  <circle cx="8" cy="16" r="1.5" fill="currentColor"/>
                  <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
                  <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="control-group">
            <button id="generate-btn" class="primary" type="button">Generate Ship</button>
          </div>

          <div class="control-group">
            <label for="camera-preset">Camera</label>
            <select id="camera-preset">
              <option value="default">Isometric</option>
              <option value="front">Front</option>
              <option value="side">Side</option>
              <option value="top">Top</option>
              <option value="dramatic">Dramatic</option>
            </select>
          </div>

          <div class="divider"></div>

          <div class="control-group">
            <label>Export</label>
            <div class="button-stack">
              <button id="export-btn" type="button">Download PNG</button>
              <button id="export-meta-btn" type="button">Download JSON</button>
            </div>
          </div>
        </div>

        <div class="traits-panel">
          <h3>Ship Traits</h3>
          <div id="traits-content" class="traits-list">
            <!-- Traits will be populated here -->
          </div>
        </div>
      </aside>
    </div>
  </div>

  <div id="render-complete" hidden></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
