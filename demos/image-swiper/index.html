<body>
  <div class="demo-banner">
    <strong>DEMO MODE</strong> - This is a preview. <a href="../../#image-swiper-install">Install locally</a> to use with your own images.
  </div>

  <div class="container">
    <header class="stats">
      <span class="stat remaining"><span id="remaining">5</span> remaining</span>
      <span class="stat archived"><span id="archived">0</span> archived</span>
    </header>

    <div class="card-container">
      <div class="card" id="card">
        <div class="placeholder-image" id="card-image">
          <div class="placeholder-content">
            <div class="placeholder-icon">&#128247;</div>
            <div class="placeholder-text">Sample Image</div>
          </div>
        </div>
        <div class="overlay overlay-left">ARCHIVE</div>
        <div class="overlay overlay-right">KEEP</div>
      </div>
      <div class="empty-state" id="empty-state">
        <p>No more images to review!</p>
        <button class="btn btn-reset" id="reset-btn">Reset Demo</button>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-archive" id="btn-archive">
        <span class="icon">&#x2715;</span>
        Archive
      </button>
      <button class="btn btn-keep" id="btn-keep">
        <span class="icon">&#x2713;</span>
        Keep
      </button>
    </div>

    <p class="hint">Use arrow keys (&larr; &rarr;) or swipe to navigate</p>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
