<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="keep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="archive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f87171"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="1100" cy="530" r="60"/>
    <circle cx="150" cy="500" r="40"/>
    <circle cx="1050" cy="130" r="50"/>
  </g>

  <!-- Card mockup - back cards -->
  <rect x="480" y="130" width="240" height="320" rx="16" fill="#2a2a4a" transform="rotate(-8 600 290)"/>
  <rect x="480" y="130" width="240" height="320" rx="16" fill="#3a3a5a" transform="rotate(5 600 290)"/>

  <!-- Main card -->
  <rect x="480" y="130" width="240" height="320" rx="16" fill="#4a4a6a"/>
  <rect x="495" y="145" width="210" height="200" rx="8" fill="#5a5a7a"/>

  <!-- Card image placeholder icon -->
  <text x="600" y="260" font-size="48" text-anchor="middle" dominant-baseline="middle">🖼️</text>

  <!-- Swipe indicators -->
  <g transform="translate(320, 270)">
    <circle cx="0" cy="0" r="35" fill="url(#archive)" fill-opacity="0.2"/>
    <text x="0" y="8" font-size="32" text-anchor="middle" fill="#ef4444">←</text>
  </g>
  <g transform="translate(880, 270)">
    <circle cx="0" cy="0" r="35" fill="url(#keep)" fill-opacity="0.2"/>
    <text x="0" y="8" font-size="32" text-anchor="middle" fill="#10b981">→</text>
  </g>

  <!-- Title -->
  <text x="600" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle">Image Swiper</text>

  <!-- Subtitle -->
  <text x="600" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#a1a1aa" text-anchor="middle">Tinder-Style Photo Organizer</text>

  <!-- Labels -->
  <text x="320" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#ef4444" text-anchor="middle">ARCHIVE</text>
  <text x="880" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#10b981" text-anchor="middle">KEEP</text>

  <!-- Author -->
  <text x="600" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#52525b" text-anchor="middle">by Sultan Peyek</text>
</svg>
