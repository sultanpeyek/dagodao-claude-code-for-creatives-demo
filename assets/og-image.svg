<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="157.5" x2="1200" y2="157.5"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Emoji icon -->
  <text x="600" y="220" font-size="100" text-anchor="middle" dominant-baseline="middle">🎨</text>

  <!-- Title -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff" text-anchor="middle">Claude Code for Creatives</text>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a1a1aa" text-anchor="middle">AI-assisted creative development demos</text>

  <!-- Accent line -->
  <rect x="450" y="440" width="300" height="4" rx="2" fill="url(#accent)"/>

  <!-- Tech tags -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#71717a">
    <text x="420" y="520" text-anchor="middle">Three.js</text>
    <text x="540" y="520" text-anchor="middle">Remotion</text>
    <text x="660" y="520" text-anchor="middle">Bun</text>
    <text x="780" y="520" text-anchor="middle">Node.js</text>
  </g>

  <!-- Author -->
  <text x="600" y="580" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#52525b" text-anchor="middle">by Sultan Peyek</text>
</svg>
